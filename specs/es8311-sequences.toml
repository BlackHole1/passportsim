[[sequence]]
id = "C"
name = "set_volume"
summary = "bsp_audio_set_volume(80): one write of the volume register"
provenance = "the esp_codec_dev volume path: the codec-device curve turns a percentage into decibels, subtracts the 3.3 V over 5 V hardware gain, and writes the half-decibel step above the -95.5 dB floor. The demo volume is 80, which that curve gives as register 0x32 = 0xB2."
ops = [{ op = "write", reg = 0x32, value = 0xB2 }]

[[sequence]]
id = "D"
name = "close"
summary = "esp_codec_dev_close -> es8311_enable(false): mute, then the 15 suspend writes"
provenance = "esp_codec_dev es8311_enable(false). The mute stage reads register 0x31 and sets mask 0x60; after sequence B that register holds 0x00, so the write is 0x60. The suspend writes follow in the order the driver issues them."
ops = [
    { op = "read", reg = 0x31, value = 0x00 },
    { op = "write", reg = 0x31, value = 0x60 },
    { op = "write", reg = 0x32, value = 0x00 },
    { op = "write", reg = 0x17, value = 0x00 },
