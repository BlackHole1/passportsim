    0xD0, 0x03, 0x09, 0x0A, 0x0A, 0x06, 0x2E,
    0x44, 0x40, 0x3A, 0x15, 0x15, 0x26, 0x2A,
]
class = "stored"
delay_ms_after = 10
provenance = "the vendor init table of the official firmware, as its boot trace shows, negative gamma; tests/milestones/m4.rs"

[[step]]
index = 19
