params = [0x0B]
class = "stored"
delay_ms_after = 0
provenance = "the vendor init table of the official firmware, as its boot trace shows; tests/milestones/m4.rs"

[[step]]
index = 12
name = "VDVS"
cmd = 0xC4
params = [0x20]
class = "stored"
