provenance = "boards/ai-passport.toml, the same rule as GPIO_FUNC*_IN_SEL_CFG. The one pin a modeled peripheral shares with GPIO, the LCD DC line on GPIO20, is driven through GPIO_OUT and not through a matrix selector. Declared class C rationale. Retired by: if any signal is ever routed through the matrix, that is, if a peripheral output of a corpus image reaches its pin through one of these selectors rather than through its board model, these rows return to U or are promoted to B with a decoded crossbar behind them"

