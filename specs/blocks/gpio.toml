value = "stored; the per-pin interrupt type, the wakeup enable and the pad hold are not acted on"
class = "C"
provenance = "The BSP installs no GPIO ISR, so IRQ source 16 can stay unconnected (UNVERIFIED: no public source states it); periph/gpio.rs keeps GPIO_STATUS as plain storage for the same reason. Declared class C rationale. Retired by: if an image ever installs a GPIO ISR, so that a pin edge has to raise IRQ source 16, or holds a pad across a sleep, these rows return to U or are promoted to B with the per-pin interrupt and hold logic behind them"
