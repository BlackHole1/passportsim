# The timing and filter registers, which the model stores and deliberately does not honor
# (class C: a declared approximation).

[[overrides]]
register = "I2C_SCL_LOW_PERIOD"
field = "I2C_SCL_LOW_PERIOD"
value = "stored and read back; honored only under a profile with i2c_clocked (specs/timing-profiles.toml), where it sets the SCL period of the list's bus time; under fast a command list runs in zero virtual time"
class = "C"
provenance = "IDF soc/esp32c3/register/soc/i2c_reg.h (SCL_LOW_PERIOD at 0x00, bits 8:0); IDF hal/esp32c3/include/hal/i2c_ll.h i2c_ll_master_cal_bus_clk (the driver writes SCL_LOW 199 for 100 kHz); the driver completes on the interrupt, so no timing value needs honoring; periph/i2c0.rs stores it through the generated table"

[[overrides]]
register = "I2C_SCL_HIGH_PERIOD"
field = "I2C_SCL_HIGH_PERIOD"
value = "stored and read back; honored only under a profile with i2c_clocked (specs/timing-profiles.toml), where it sets the SCL period of the list's bus time; under fast a command list runs in zero virtual time"
class = "C"
provenance = "IDF esp_driver_i2c/i2c_master.c waits for the transaction interrupt, which may be delivered immediately or after the real bus time, so no timing value needs honoring; periph/i2c0.rs stores these"

[[overrides]]
register = "I2C_SDA_HOLD"
field = "I2C_SDA_HOLD_TIME"
value = "stored and read back; the value is not honored, because a command list runs in zero virtual time"
