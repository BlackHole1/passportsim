# Block spec of the `intc` row of `c3_devices!` (crates/pemu-soc-c3/src/periph/mod.rs).
# Model: crates/pemu-soc-c3/src/intc.rs.
schema = 1
block = "intc"
base = 0x600C_2000
size = 0x1000
class = "B"
milestone = "M1"
provenance = "base IDF soc/esp32c3/register/soc/reg_base.h (DR_REG_INTERRUPT_BASE, the matrix); size 0x1000 matches the DATE register at offset 0x7FC (IDF soc/esp32c3/register/soc/interrupt_core0_reg.h)"

# One map register per source at +4 * source, then the CPU-side enable, type, clear, priority and
# threshold registers. Source numbering is generated by name from specs/irq-sources.toml and
# cross-checked against these map offsets by codegen, not by a row here. 79,730 writes in the
# reference trace. Without delivery there is no tick and no yield.
# No busy-wait row: the guest polls no status bit of this block. The FROM_CPU yield poll is in
# specs/blocks/system.toml, because the register it polls belongs to the SYSTEM block.

[[stable_read]]
register = "INTERRUPT_CORE0_CPU_INT_ENABLE"
provenance = "IDF soc/esp32c3/register/soc/interrupt_core0_reg.h (+0x104): the guest reads it back through IDF esprv_intc_int_enable, so the value is a function of modeled state"

[[stable_read]]
register = "INTERRUPT_CORE0_CPU_INT_THRESH"
provenance = "IDF soc/esp32c3/register/soc/interrupt_core0_reg.h (+0x194): read back by IDF esprv_intc_int_set_threshold, which the port calls on every critical section"

[[stable_read]]
register = "INTERRUPT_CORE0_INTR_STATUS_0"
provenance = "IDF soc/esp32c3/register/soc/interrupt_core0_reg.h (+0x0F8): the pending set is a function of the modeled interrupt fabric, and the panic handler reads it"

[[stable_read]]
register = "INTERRUPT_CORE0_INTR_STATUS_1"
provenance = "IDF soc/esp32c3/register/soc/interrupt_core0_reg.h (+0x0FC): same rule as INTR_STATUS_0"

[[reset_domains]]
registers = "*"
scopes = ["chip", "system", "core"]
provenance = "IDF soc/reset_reasons.h; TRM Reset and Clock chapter: the interrupt matrix is in the digital domain, which every reset scope restores"

# Classes of the registers the intc model implements exactly. Every register of this window is
# the interrupt fabric, implemented in crates/pemu-soc-c3/src/intc.rs and checked against the
# reference model intc::tests::Reference over 40,000 driven operations
# (intc::tests::the_fabric_follows_the_reference_model), so the rows below carry the register's
# behavior rather than a deliberate difference from the IDF header. One class C: the block clock
# gate, whose value is exact and whose effect is not modeled.

[[overrides]]
register = "INTERRUPT_CORE0_MAC_INTR_MAP"
value = "route of interrupt source 0 (MAC_INTR) onto a CPU line, 5 bits RW; 0 leaves the source unconnected"
class = "B"
provenance = "IDF soc/esp32c3/register/soc/interrupt_core0_reg.h (+0x000 = 4 * 0): IrqFabric stores the route and rebuilds the source mask of the line it names, so several sources on one line are ORed and a re-route takes effect at once. intc::tests::{map_offsets_follow_the_generated_source_table, a_map_write_reroutes_immediately, an_unrouted_source_reaches_no_line, two_sources_on_one_line_are_ored, the_fabric_follows_the_reference_model}; the source number is cross-checked against specs/irq-sources.toml by codegen"

