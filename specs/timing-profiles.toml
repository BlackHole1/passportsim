# The `app ready -> buttons` phase carries a delta band derived from silicon, not the default
# 5 ms floor. The phase is 6 ms on dev:L73 to L78 (845 to 851), but
# the same app build (each log's `ELF file SHA256` line equals `boot_log.bin`'s) reads it
# differently from boot to boot: an LVGL render lands inside the phase or not. The 13 logged
# silicon boots of that build under the data root, each log's full boot, read (`pk_app: ready`
# to `bsp_btn: 按键就绪`, ms):
#   device/boot_log.bin                              845 -> 851   6  (the reference, dev:L73-L78)
#   device/golden/logs/audit-boot-console.log        814 -> 828  14
#   device/golden/logs/audit-final-boot.log          814 -> 828  14
#   device/golden/logs/audit-pre-reset-drain.log     820 -> 829   9
#   device/golden/logs/device-capture-selftest.log   818 -> 827   9
#   device/golden/logs/device-open-test-first.log    816 -> 829  13
#   device/golden/logs/device-open-test-second.log   813 -> 825  12
#   device/golden/logs/device-open-test2-A1.log      816 -> 825   9
#   device/golden/logs/device-open-test2-baseline_A.log 816 -> 825 9
#   device/golden/logs/device-open-test2-reset_C.log 816 -> 829  13
#   device/golden/logs/device-pre.log                823 -> 826   3
#   device/golden/logs/device-pre.predrain.log       821 -> 825   4
#   device/golden/logs/passport-keys-restored.log    816 -> 825   9
# (all 13 timestamp sequences are distinct, so no boot is counted twice). Silicon itself spans
# 3 to 14 ms, 3 below and 8 above the reference, so the band is 8 ms either side of the 6: the
# widest distance of a real boot from the reference, the smallest band every logged boot of this
# build passes. The default 5 ms would fail 5 of the 13 silicon boots (12, 13, 13, 14, 14). No
# timing constant was moved for it; under U4 the emulator reads 13 ms.
[[anchor]]
name = "buttons"
line = "bsp_btn: 按键就绪"
dev = "L78"
device_ms = 851
role = "validation"
delta_band_ms = 8
band_basis = "13 logged silicon boots of the reference build read 3 to 14 ms against the reference 6 (comment above); the widest distance from the reference is 8 ms"

