[[constant]]
name = "mmio_cpu_cycles"
unit = "CPU cycles every access to a peripheral (MMIO) page takes besides its APB cycles, one of them the instruction's own; all of an access to a block off the APB path"
fast = 0
device = 2
class = "A"
basis = "device-probe_campaign_timing-20260925T042926Z-run1 lines 193, 195, 200 and 201 and device-probe_campaign_timing-20260924T234712Z-run1 line 142, read with the probe's ELF (the cpi_mmio_read and cpi_mmio_write kernels, whose loop alone and base cycles are 3326 and 3071): a GPIO read costs 6 CPU cycles at CPU 160 MHz and 4 at 80 (13821 and 9470), a GPIO write 8 and 5 (17407 and 11263), with APB at 80 MHz both times. A fixed 2 CPU cycles plus 2 APB cycles a read and 3 a write fits all four, where all-APB rows predicted 3 and 4 at 80 MHz (7422 and 9215). An EXTMEM_ICACHE_CTRL read (line 195, 5374) costs 2 cycles at 160 MHz, to the cycle: the cache controller's block (EXTMEM, 0x600C_4000, 4 KB) is off the APB path and pays this row alone; its write is taken to cost the same (class B inside the row)"

[[constant]]
name = "mmio_load_apb_cycles"
unit = "APB cycles a load from an APB peripheral page takes beyond mmio_cpu_cycles; the CPU pays that many APB periods rounded up to whole CPU cycles"
fast = 0
device = 2
class = "B"
basis = "With mmio_cpu_cycles: GPIO_IN and SYSTIMER_CONF read in 6 CPU cycles at CPU 160 MHz (device-probe_campaign_timing-20260925T042926Z-run1 lines 193 and 194, 13821 each) and GPIO_IN in 4 at CPU 80 MHz (line 200, 9470), 2 CPU cycles and 2 APB cycles, to the cycle at 80 MHz. At 160 MHz the kernel reads one cycle more an iteration than the row (255 of 13821, -1.8 %): its iteration is an odd number of CPU cycles, and the first read of the next waits for an APB clock edge, a phase the class table does not carry (class C). Was 3 APB cycles in all, which read 7422 at 80 MHz. GPIO's and SYSTIMER's number, applied to every APB block (class B: the others are not timed). The TRM places the interrupt controller's registers in the APB range (1.5.3); EXTMEM is not (mmio_cpu_cycles)"

[[constant]]
name = "mmio_store_apb_cycles"
unit = "APB cycles a store to an APB peripheral page takes beyond mmio_cpu_cycles, charged as mmio_load_apb_cycles is"
