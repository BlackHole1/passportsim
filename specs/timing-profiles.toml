[[constant]]
name = "sram_bank_cycles"
unit = "cycles an 8-byte code chunk costs when the fetch finds its SRAM bank held by a dense run of data accesses, code and data both in SRAM Block 1"
fast = 0
device = 1
class = "B"
basis = "device-probe_campaign_timing-20260925T100555Z run1 and run2 (identical) lines 236 to 253 (TIME dres_<load|store>_c<cc>, read with the probe's ELF: eight lw or sw t0, 0(a0) and a 32-bit addi and bnez, a 40-byte loop of 256 iterations from Block 1 IRAM at 0x40382508 plus 8 to 64 bytes, the word in Block 1 DRAM at 0x3fc8f840 plus 0 to 64): 3583 cycles when (code offset + data offset) / 8 is even and 3839 when odd, loads and stores alike, against 3071 for the loop alone; the model reads 3583 and 3838 (one iteration at the loop's edge uncharged). SRAM Block 1 is two banks interleaved on address bit 3; an aligned 8-byte code chunk is one bank's, and while every cycle since the previous chunk was fetched held its bank with a data access the fetch waits one cycle: the loop's five chunks alternate banks from the head's, so three cost one when the word shares the head's bank and two when it does not. The same rule gives the original kernels (lines 132 and 137, 3838 each: ram_word at 0x3fc8f8e8 in the head's bank of cpi_load_dram and in the other of cpi_store_dram, whose head is at 0x40381942) and the gap-0 loops (lines 160 and 164: 3838) to the cycle, their Block 1 placements (lines 144, 147, 148 and 151: 3583 and 4094 at 0x3fc8f8e0 and 0x3fc9c900) and the 80 MHz twins (lines 198 and 199: 3583 and 4094) within one cycle, and the first capture's 3583 and 4094 (device-probe_campaign_timing-20260924T234712Z-run1 lines 132 and 137: ram_word at 0x3fc8de20, bit 3 clear, in a scratch rebuild of that build, where the rule charges 2 and 3 cycles an iteration); with the data in Block 2 (lines 152 to 159, 168 to 175) or the code in flash (the cpi_flash_* lines) the kernels read the loop alone. Class C inside the row: loops whose accesses leave the fetch a free cycle, where the rule charges nothing, read more on five rows (cpi_at_load_dram_use and _use_gap1 +1 and +4 cycles an iteration with the word at 0x3fc8f8e0, lines 145 and 146, and so the original twins in the first capture; the gap-3 loops +1, lines 163 and 167; cpi_x_load_store_data +1, line 192), left at their residue"

[[constant]]
name = "adc_conversion_ps"
unit = "ps from the rising edge of APB_SARADC_ONETIME_START to the done bit of a one-shot conversion"
fast = 0
device = 26240000
class = "B"
basis = "device-probe_campaign_regs-20260926T024930Z-run1.clean.log line 429 (TIME adc_oneshot_read: 64 one-shot reads of ADC1 channel 0 at 12 dB through IDF v5.5.3 adc_oneshot_read, the unit set up as the driver sets it, APB_ADC_CLKM_CONF 0x0040400f and FSM_WAIT 0x00640805 at lines 399 and 397) reads 3029 us and 484360 cycles, 47.3 us a read. With the conversion at 0 the emulator read 1352 us and 216122 cycles: the driver's CPU work at the committed cycle costs (the lock, the clock and calibration setup with its three regi2c read-modify-writes, the 3 us esp_rom_delay_us that lets the controller see onetime_start, the done poll). The rest, 26.2 us a read, is charged from the rising edge of onetime_start to the done bit. 26.24 us reads 3026 us and 484026 cycles (-0.1 % and -0.07 %): the driver polls INT_RAW in a loop of 13 cycles, so the time of the 64 reads moves in steps of 832 cycles, and the next step (26.3 us) reads 3031 us and 484858 cycles. At the driver's clock, the 80 MHz APB divided by 16, 26.24 us is 131 cycles of the 5 MHz controller clock, of which FSM_WAIT's standby (100), reset (8) and power-up (5) waits would make 113 and the sampling and the 12-bit conversion the rest; that split is a reading, UNVERIFIED. Class B: one capture, the whole residue of the read, which also takes in anything else on the path the model times as zero (the regi2c BUSY bit reads 0 at once, specs/blocks/regi2c.toml), at one clock setting: the time does not scale with the divider or the FSM counts (class C inside the row; no corpus image changes them). fast keeps 0, the same-access completion of g3-adc-read-path"

# Calibration plan (`pemu_verify::calibrate`). The `[[fit]]` rows are the constants the
# least-squares fit solves for; `start` is where it starts, `step` the forward-difference step,
# `quantum` the rounding of the committed value. The `[[anchor]]` rows are device lines of
# dev:L4-L80 (the reference boot, `device/boot_log.bin`, last boot, normalized), in boot order,
# with the device timestamp. The role belongs to the phase that ends at the anchor: `fit` phases
# are minimised, `validation` phases are judged against their timing bands, and no phase is both,
# so a fit is never judged by the phases it was fitted to. The first anchor has no phase and is
# judged by its absolute band.

[[fit]]
name = "ble_enable_nvs_cal_ps"
start = 0
step = 20000000000
min = 0
max = 500000000000
quantum = 1000000000

