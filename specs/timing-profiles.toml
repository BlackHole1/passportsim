class = "B"
basis = "device-probe_campaign_timing-20260925T042926Z-run1 lines 189 and 190 (TIME cpi_x_div_q0 31744, cpi_x_div_by1 70656; 8 div t0, t1, t2 a loop of 256 at an aligned head, whose loop alone and base cycles are 3072): 7 / 1000000 costs 15 cycles, 1000000 / 1 costs 34; and device-probe_campaign_timing-20260924T234712Z-run1 line 139 (cpi_div 66814): 1000000 / 7 costs 32. One cycle, 13, and one more per quotient bit a divider that normalises both operands iterates over (1, 20 and 18) reproduces all three to the cycle; so does the quotient's bit count, and the operand form is taken because the divider knows it before it starts. Magnitudes for div and rem; a zero divisor, rem and the unsigned forms follow the same rule unmeasured (class B). Replaces div_cycles 31, one operand pair's"

