# The 80-byte CW2017 battery profile of the AI Passport BSP, which the emulator's `battery` domain
# holds by default.
#
# The bytes are the table the BSP compares the gauge against and writes when it differs. A gauge
# holding them makes bsp_battery_init match on its first read and take the fast path of 1 + 1 + 80
# reads with no writes, which is why they are the default start state of the `battery` domain.
# They are also compiled into crates/pemu-board/src/cw2017.rs as `BSP_PROFILE`, because a core
# crate parses no TOML at run time; crates/pemu-board/tests/cw2017.rs asserts the two copies agree
# byte for byte.
#
# This is a cell characterisation table, not a device identity: it is the same for every unit of
# this product and carries no MAC, serial or calibration word.

schema = 1
chip = "cw2017"
register = "PROFILE"
reg = 0x10
length = 80
class = "B"
provenance = "the profile table of the AI Passport BSP in the official firmware, the 80 bytes it compares and writes; the CW2017 datasheet text does not give the profile area. tests/milestones/m5.rs t1_m5_v0_pk_reads_the_cw2017_the_device_reads shows the BSP taking the matched fast path. The default battery start state holds these bytes so that the BSP logs its profile-matched boot line."

bytes = [
    0x64, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0xAD, 0xC7, 0xC8, 0xCA, 0xBD, 0xB1, 0xC1, 0x94,
    0x88, 0xD1, 0xBD, 0x97, 0x88, 0x66, 0x56, 0x4A,
    0x3F, 0x33, 0x26, 0x5C, 0x37, 0xD1, 0x27, 0xD8,
    0xCC, 0xB7, 0xCF, 0xB3, 0xB2, 0xAE, 0xA6, 0x9E,
    0x99, 0x97, 0x9B, 0x86, 0x47, 0x1E, 0x17, 0x26,
    0x49, 0x96, 0xD9, 0xE1, 0xDD, 0xDC, 0xD4, 0x59,
    0x00, 0x00, 0x90, 0x02, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x64, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x5C,
]
