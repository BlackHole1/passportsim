# QEMU oracle region map, used by the QEMU trace ingest of `cargo xtask oracle`.
#
# A QEMU memory-region trace line names a region, not a block, and several regions cover
# more than one block while one catch-all region covers every block QEMU does not model (a QEMU
# run of the official image gave the region names and the catch-all pages; its output is not
# committed). Accesses are therefore resolved by address through the [[block]] table and the
# [[region]] table only records which region name is expected to reach which block, so a QEMU build that renames or re-splits a region is reported rather
# than silently mapped.
#
# The [[block]] rows are the c3_devices! table of crates/pemu-soc-c3/src/periph/mod.rs,
# which carries every MMIO base and size; sizes there are UNVERIFIED at 0x1000
# except the RTC_CNTL / eFuse split slot and NRX.
#
# A [[region]] row carries `covers`, the human description, and `blocks`, the machine-readable
# list of [[block]] names an access through that region name is expected to resolve to. The
# ingest checks the resolved block against that list and reports a mismatch instead of mapping
# it away, so a QEMU build that re-splits a region (a `misc.esp.sha` access landing at a TIMG
# address, say) is caught. The catch-all region names no blocks: by definition it reaches every
# block QEMU does not model.
#
# `trusted` is true where QEMU is trusted for ordered per-block write streams (SHA, TIMG,
# SYSTIMER, INTMATRIX, USJ, eFuse, cache, SPI1, RTC_CNTL), false everywhere else. A false block is
# ingested and histogrammed but never diffed.

schema = 1

[[block]]
name = "uart0"
base = 0x6000_0000
size = 0x1000
trusted = false

[[block]]
name = "spi1"
base = 0x6000_2000
size = 0x1000
trusted = true

[[block]]
name = "spi0"
