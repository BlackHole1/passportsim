# Region names seen in a QEMU run of the official image.
# `catch_all = true` marks the region that covers every unmodeled block; its accesses are
# resolved by address alone.

[[region]]
name = "esp_soc.uart"
covers = "UART0 and UART1"
blocks = ["uart0", "uart1"]

[[region]]
name = "esp.systimer"
covers = "SYSTIMER"
blocks = ["systimer"]

[[region]]
name = "esp32.gpio"
covers = "GPIO"
blocks = ["gpio"]

[[region]]
name = "esp32c3.cache"
covers = "EXTMEM and the MMU table"
blocks = ["extmem", "mmu"]

[[region]]
name = "esp32c3.gdma"
covers = "GDMA"
blocks = ["gdma"]

[[region]]
name = "esp32c3.soc.clk"
covers = "SYSTEM"
blocks = ["system"]

[[region]]
name = "misc.esp.sha"
covers = "SHA"
blocks = ["sha"]

[[region]]
name = "misc.esp32c3.intmatrix"
covers = "INTC"
blocks = ["intc"]

[[region]]
name = "misc.esp32c3.rtc_cntl"
covers = "RTC_CNTL"
blocks = ["rtc_cntl"]

[[region]]
name = "misc.esp32c3.usb_serial_jtag"
covers = "USB Serial/JTAG"
blocks = ["usj"]

[[region]]
name = "nvram.esp.efuse"
covers = "eFuse"
blocks = ["efuse"]

[[region]]
name = "ssi.esp32c3.spi"
covers = "SPI1, the flash controller"
blocks = ["spi1"]

[[region]]
name = "timer.esp.timg"
covers = "TIMG0 and TIMG1"
blocks = ["timg0", "timg1"]

[[region]]
name = "esp32c3.iomem"
covers = "every block QEMU does not model"
catch_all = true
