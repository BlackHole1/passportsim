# Crate layering: docs/ARCHITECTURE.md (Layering).
[package]
name = "pemu-radio"
description = "BLE, Wi-Fi and virtual LAN models of PassportSim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pemu-hle.workspace = true
# The BLE handlers name `pemu_core` snapshot codecs and interrupt sources, and bind against
# `pemu_loader` ELF symbols and its TOML reader. Both are reachable through `pemu-hle` in the
# layering graph, so these are direct edges on paths the graph already allows.
pemu-core.workspace = true
pemu-loader.workspace = true
# The virtual LAN parses and emits every header with `smoltcp::wire` (0BSD, allowed in
# deny.toml).
smoltcp.workspace = true

[dev-dependencies]
# The handler tests name `Trap`, the error of `GuestView::read` (reachable through `pemu-hle`).
pemu-rv32.workspace = true

# Every large fixed-size buffer is heap-built: a Windows .exe gets a 1 MiB stack from its PE
# header where macOS gives 8 MiB. The size the lints treat as large is `array-size-threshold`
# of this crate's clippy.toml.
[lints.clippy]
large_stack_arrays = "deny"
large_stack_frames = "deny"
