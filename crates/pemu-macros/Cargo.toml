[package]
name = "pemu-macros"
description = "Proc macros of PassportSim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

# Every large fixed-size buffer is heap-built, because a Windows .exe gets a 1 MiB stack from its
# PE header where macOS gives 8 MiB. The size the lints treat as large is `array-size-threshold` of
# this crate's clippy.toml.
[lints.clippy]
large_stack_arrays = "deny"
large_stack_frames = "deny"
