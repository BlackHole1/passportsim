[package]
name = "pemu-rv32"
description = "RV32IMC CPU model of PassportSim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pemu-core.workspace = true

# Large fixed-size buffers are heap-built: a Windows .exe gets a 1 MiB main stack, macOS 8 MiB.
# The size the lints treat as large is `array-size-threshold` of this crate's clippy.toml.
[lints.clippy]
large_stack_arrays = "deny"
large_stack_frames = "deny"

# The browser entry of workload K, built for wasm32 by `cargo xtask bench-browser`. A cdylib so the
# exports survive; an example so the production wasm ABI gains nothing.
[[example]]
name = "kbench_wasm"
crate-type = ["cdylib"]
