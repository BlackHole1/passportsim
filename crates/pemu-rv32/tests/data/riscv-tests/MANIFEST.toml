# Provenance of the committed riscv-tests ELFs.
#
# Written by `cargo xtask riscv-tests fetch-build`; never edited by hand.
# `cargo xtask riscv-tests` verifies every hash and size below and then
# runs `cargo test -p pemu-rv32 --test riscv_tests`.
#
# Upstream is BSD-3-Clause; the attribution lives in THIRD_PARTY.md.
#
# `env_shim` is the committed C3 shim over the upstream `p` prologue; that
# header states what it adjusts (two prologue hooks: a CSR write the C3 cannot
# take, and the vectored mtvec base the C3 forces) and why. Test bodies, the link
# script, the trap vector and the pass/fail protocol are upstream's.

schema = "passport-emu/riscv-tests-manifest/1"
upstream = "https://github.com/riscv-software-src/riscv-tests"
commit = "2ebecad997fa58cd9e5724340ba75aa4b59bd1d0"
env_submodule = "https://github.com/riscv-software-src/riscv-test-env"
env_commit = "6de71edb142be36319e380ce782c3d1830c65d68"
license = "BSD-3-Clause"
toolchain = "riscv32-esp-elf-gcc (crosstool-NG esp-14.2.0_20251107) 14.2.0"
environment = "p"
env_shim = "xtask/src/riscv_tests/c3_env_p.h"
env_shim_sha256 = "de988161f46d740efa53d3dbde8b02e70d69b3e4e87ad4a302221f61e3f0003c"
pass_value = 1
suites = ["rv32ui", "rv32um", "rv32uc"]
build = "riscv32-esp-elf-gcc -march=rv32imc_zicsr_zifencei -mabi=ilp32 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -I<c3 env shim> -I<env/p> -I<isa/macros/scalar> -c <isa/SUITE/NAME.S> -o SUITE-p-NAME.o && riscv32-esp-elf-gcc -march=rv32imc_zicsr_zifencei -mabi=ilp32 -static -mcmodel=medany -fvisibility=hidden -nostdlib -nostartfiles -T<env/p/link.ld> SUITE-p-NAME.o -o SUITE-p-NAME"

