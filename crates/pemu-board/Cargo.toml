# Crate layering: docs/ARCHITECTURE.md (Layering).
[package]
name = "pemu-board"
description = "Board traits and AI Passport board chips."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pemu-core.workspace = true
# `Chip: Serialize + DeserializeOwned`: the chip models derive both halves, so the feature is
# named here rather than borrowed from another crate's feature unification.
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

# Every large fixed-size buffer is heap-built: a Windows .exe gets a 1 MiB stack from its PE
# header where macOS gives 8 MiB. The size the lints treat as large is `array-size-threshold`
# of this crate's clippy.toml.
[lints.clippy]
large_stack_arrays = "deny"
large_stack_frames = "deny"
