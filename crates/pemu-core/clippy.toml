# Core crate clippy configuration: the std APIs a core crate may not use.
#
# Clippy reads the clippy.toml nearest to a crate's manifest and does not merge it with the root
# file, so every core crate carries an identical copy of this file and host crates, xtask and
# tests/milestones (which read the root clippy.toml) stay unrestricted. `cargo xtask layering`
# fails when a core crate's copy misses an entry below or a setting of the root clippy.toml.
# Test code that needs one of these APIs allows the lints locally, for example with
# `#![cfg_attr(test, allow(clippy::disallowed_types, clippy::disallowed_methods))]`.

# A large fixed-size buffer built on the stack overflows the 1 MiB stack a Windows .exe gets from
# its PE header, where macOS gives 8 MiB.
array-size-threshold = 262144

disallowed-types = [
    { path = "std::time::Instant", reason = "use VTime and the virtual clock" },
    { path = "std::time::SystemTime", reason = "use VTime and the virtual clock" },
    { path = "std::thread::JoinHandle", reason = "core crates are single-threaded" },
    { path = "std::thread::Thread", reason = "core crates are single-threaded" },
    { path = "std::thread::Builder", reason = "core crates are single-threaded" },
    { path = "std::thread::Scope", reason = "core crates are single-threaded" },
    { path = "std::thread::LocalKey", reason = "core crates are single-threaded" },
    { path = "std::fs::File", reason = "core crates do no file I/O" },
    { path = "std::fs::OpenOptions", reason = "core crates do no file I/O" },
    { path = "std::fs::DirEntry", reason = "core crates do no file I/O" },
    { path = "std::fs::ReadDir", reason = "core crates do no file I/O" },
    { path = "std::fs::Metadata", reason = "core crates do no file I/O" },
    { path = "std::net::TcpStream", reason = "host I/O goes through HostIo" },
    { path = "std::net::TcpListener", reason = "host I/O goes through HostIo" },
    { path = "std::net::UdpSocket", reason = "host I/O goes through HostIo" },
    { path = "std::process::Command", reason = "core crates spawn no processes" },
    { path = "std::process::Child", reason = "core crates spawn no processes" },
    { path = "std::process::Stdio", reason = "core crates spawn no processes" },
    { path = "std::env::Args", reason = "core crates read no environment" },
    { path = "std::env::Vars", reason = "core crates read no environment" },
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet" },
    { path = "std::hash::RandomState", reason = "random hashing is not deterministic" },
]

disallowed-methods = [
