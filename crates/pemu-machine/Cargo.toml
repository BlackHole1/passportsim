# Crate layering: docs/ARCHITECTURE.md (Layering).
[package]
name = "pemu-machine"
description = "Machine composition and run loop of PassportSim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["bundled-rom"]
# Passes through to pemu-loader: `Assets::with_bundled_rom` exists only with it.
bundled-rom = ["pemu-loader/bundled-rom"]

[dependencies]
# pemu-machine may use all crates above it.
pemu-core.workspace = true
pemu-rv32.workspace = true
pemu-soc-c3.workspace = true
pemu-board.workspace = true
pemu-loader.workspace = true
pemu-hle.workspace = true
pemu-radio.workspace = true

# Every large fixed-size buffer is heap-built: a Windows .exe gets a 1 MiB stack from its PE
# header where macOS gives 8 MiB. The size the lints treat as large is `array-size-threshold`
# of this crate's clippy.toml.
[lints.clippy]
large_stack_arrays = "deny"
large_stack_frames = "deny"
