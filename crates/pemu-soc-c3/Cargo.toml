[package]
name = "pemu-soc-c3"
description = "ESP32-C3 SoC model of PassportSim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pemu-core.workspace = true
pemu-rv32.workspace = true
# The SoC reaches the board only through its traits (`SocBus::board: &mut dyn BoardPorts`).
pemu-board.workspace = true

# Every large fixed-size buffer is heap-built: a Windows .exe gets a 1 MiB stack from its PE
# header where macOS gives 8 MiB. The size the lints treat as large is `array-size-threshold` of
# this crate's clippy.toml.
[lints.clippy]
large_stack_arrays = "deny"
large_stack_frames = "deny"
