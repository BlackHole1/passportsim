[package]
name = "pemu-milestones"
description = "Milestone tests of PassportSim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dev-dependencies]
pemu-testkit.workspace = true
# Every crate below is inside the closure this package already has through
# `pemu-testkit -> pemu-machine -> pemu-soc-c3 -> pemu-board`, so `xtask layering` accepts it.
pemu-core.workspace = true
pemu-rv32.workspace = true
pemu-soc-c3.workspace = true
pemu-board.workspace = true
pemu-machine.workspace = true
pemu-hle.workspace = true
pemu-loader.workspace = true
pemu-radio.workspace = true
pemu-host.workspace = true
serde_json.workspace = true
pemu-planner.workspace = true
pemu-api.workspace = true
pemu-verify.workspace = true

