# What `cargo xtask probes` built, and from what. Written by that command;
# `cargo xtask probes --check` rebuilds every probe and compares.
#
# `source` and `elf_stripped` hashes are checkable with no toolchain. The
# other artifacts stay outside the repository, and their hashes reproduce
# only in `build_dir` (`~` is the builder's home): the app image carries the
# ELF's SHA-256, and the ELF's debug information depends on the directory.

schema = "passport-emu/probes-manifest/2"
target = "esp32c3"
flash_size_bytes = 8388608
idf_version = "v5.5.3"
idf_commit = "2c211b236707889e8400c4dc5644dd5c4ee071e0"
toolchain = "riscv32-esp-elf-gcc (crosstool-NG esp-14.2.0_20251107) 14.2.0"
strip_command = "riscv32-esp-elf-strip <strip> -R .flash_rodata_dummy -R .dram0.dummy <name>.elf"
build_dir = "~/Library/Application Support/passportsim/corpus/probes/build"
common_sdkconfig = "probes/common/sdkconfig.defaults"
common_sdkconfig_sha256 = "b9c9d8b17a5098602892e008d53c656d2eed212d6d036c59aafa32cc1b349495"
probe_line_h = "probes/common/probe_line.h"
probe_line_h_sha256 = "46c5e00a349d852387d9e7d4f71a9d80f4236ec105e1e50f1aa944b667a216ec"
elf_committed = true
elf_committed_note = "the stripped ELF of each probe is committed at `elf_stripped`, under the 1048576 byte limit for committed binaries; the unstripped ELF and the merged image stay outside the repository"

